<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sistem - SMPN 1 Tempuran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    .card { width: 100%; max-width: 400px; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h2 { text-align: center; color: #1e293b; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 25px; font-size: 14px; }
    .form-group { margin-bottom: 18px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: #334155; font-size: 14px; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; font-size: 15px; }
    button:hover { background: #1d4ed8; }
    .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: 500; font-size: 13px; display: none; }
    .alert-danger { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; }
    .footer-link a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Portal Login</h2>
  <p class="subtitle">Sistem Ekskul SMPN 1 Tempuran</p>
  
  <div id="alert-box" class="alert alert-danger"></div>

  <form id="login-form">
    <div class="form-group">
      <label for="username">Username / Email</label>
      <input type="text" id="username" required placeholder="Masukkan Username / Email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Masukkan Password">
    </div>

    <div class="form-group">
      <label for="role">Hak Akses / Role</label>
      <select id="role" required>
        <option value="">-- Pilih Akses --</option>
        <option value="admin">Admin</option>
        <option value="operator">Operator</option>
        <option value="kepsek">Kepala Sekolah</option>
      </select>
    </div>

    <button type="submit">Masuk ke Sistem</button>
  </form>

  <div class="footer-link">
    <a href="index.html">&larr; Kembali ke Form Pendaftaran Siswa</a>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ggpcizwstwiselfzsbbi.supabase.co';
  // PASTIKAN PASTE KUNCI EYJ... DARI TAB LEGACY ANON SUPABASE
  const SUPABASE_ANON_KEY = 'PASTE_KUNCI_JWT_EYJ_DI_SINI'; 

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    showAlert('', false);

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    // Cek pengguna di tabel admin_users
    const { data, error } = await db
      .from('admin_users')
      .select('*')
      .eq('username', username)
      .eq('role', role)
      .single();

    if (error || !data) {
      showAlert('Username atau Hak Akses tidak ditemukan!');
      return;
    }

    // Verifikasi Password (Jika di DB disimpan plain text)
    if (data.password !== password) {
      showAlert('Password yang Anda masukkan salah!');
      return;
    }

    // Simpan session sederhana di browser
    localStorage.setItem('user_session', JSON.stringify({
      id: data.id,
      nama: data.nama || username,
      role: data.role
    }));

    // Arahkan ke halaman dashboard
    alert('Login Berhasil sebagai ' + role.toUpperCase());
    window.location.href = 'dashboard.html';
  });

  function showAlert(msg, show = true) {
    const box = document.getElementById('alert-box');
    if (!show) {
      box.style.display = 'none';
      return;
    }
    box.innerText = msg;
    box.style.display = 'block';
  }
</script>
</body>
</html>
