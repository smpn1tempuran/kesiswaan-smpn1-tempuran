<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin / Operator - SMPN 1 Tempuran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; padding: 20px; color: #333; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    h3 { margin-top: 0; text-align: center; color: #1e293b; margin-bottom: 20px; }
    label { font-weight: 600; display: block; margin-top: 12px; font-size: 14px; color: #334155; }
    input, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; font-size: 15px; }
    button:hover { background: #1d4ed8; }
    #log { margin-bottom: 15px; padding: 12px; border-radius: 6px; font-size: 13px; display: none; word-break: break-word; }
    .err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

<div class="box">
  <h3>Login Admin / Operator</h3>
  <div id="log"></div>

  <form id="form-login">
    <label for="email">Email</label>
    <input type="email" id="email" value="kesiswaan@smpn1tempuran.sch.id" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Masukkan Password" required>

    <button type="submit" id="btn">MASUK SISTEM</button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ggpcizwstwiselfzsbbi.supabase.co';
  
  // PASTE KUNCI ANON DARI SUPABASE SETTINGS > API DI SINI:
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncGNpendzdHdpc2VsZnpzYmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjE5MDYsImV4cCI6MjEwNzQzNzkwNn0.IghtFISYdlY_mVkVGrz3bZvsOTq3NN6q2jYlKybU81E';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function printLog(msg, isError = false) {
    const box = document.getElementById('log');
    box.style.display = 'block';
    box.className = isError ? 'err' : 'ok';
    box.innerText = msg;
  }

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerText = 'Mencoba Login...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data: authData, error: authError } = await db.auth.signInWithPassword({ email, password });

    if (authError) {
      printLog('GAGAL AUTH: ' + authError.message, true);
      btn.disabled = false;
      btn.innerText = 'MASUK SISTEM';
      return;
    }

    printLog('AUTH BERHASIL! Memeriksa data admin_users...');

    const { data: userData, error: userError } = await db
      .from('admin_users')
      .select('*')
      .eq('user_id', authData.user.id);

    if (userError) {
      printLog('GAGAL CEK TABEL: ' + userError.message, true);
      btn.disabled = false;
      btn.innerText = 'MASUK SISTEM';
      return;
    }

    if (!userData || userData.length === 0) {
      printLog('USER_ID ' + authData.user.id + ' BELUM ADA DI TABEL admin_users!', true);
      btn.disabled = false;
      btn.innerText = 'MASUK SISTEM';
      return;
    }

    printLog('LOGIN BERHASIL! Mengalihkan ke Dashboard...');
    localStorage.setItem('user_role', userData[0].peran || 'operator');
    localStorage.setItem('user_name', userData[0].nama || 'Petugas');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
  });
</script>
</body>
</html>
