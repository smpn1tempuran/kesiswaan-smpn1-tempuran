<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sistem Kesiswaan - SMPN 1 Tempuran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: #ffffff; padding: 35px 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    .login-card h2 { margin-bottom: 5px; color: #1e293b; font-size: 20px; }
    .login-card p { color: #64748b; font-size: 13px; margin-bottom: 25px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #2563eb; }
    .btn-login { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-login:hover { background: #1d4ed8; }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>SMPN 1 TEMPURAN</h2>
  <p>Sistem Informasi Kesiswaan & Ekstrakurikuler</p>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email Pengguna</label>
      <input type="email" id="email" placeholder="admin@smpn1tempuran.sch.id" required>
    </div>
    <div class="form-group">
      <label>Kata Sandi</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login" id="btnSubmit">Masuk ke Dashboard</button>
    <div id="errorMsg" class="error-msg">Email atau password salah!</div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ggpcizwstwiselfzsbbi.supabase.co';
  // PASTIKAN SINKRONKAN DENGAN ANON KEY SUPABASE:
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncGNpendzdHdpc2VsZnpzYmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjE5MDYsImV4cCI6MjEwNzQzNzkwNn0.IghtFISYdlY_mVkVGrz3bZvsOTq3NN6q2jYlKybU81E';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnSubmit');
    const err = document.getElementById('errorMsg');

    btn.innerText = 'Memeriksa...';
    btn.disabled = true;
    err.style.display = 'none';

    // 1. Autentikasi dengan Supabase Auth
    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      err.innerText = 'Login Gagal: ' + error.message;
      err.style.display = 'block';
      btn.innerText = 'Masuk ke Dashboard';
      btn.disabled = false;
      return;
    }

    // 2. Ambil Role dari Tabel user_roles
    let userRole = 'admin'; // default fallback
    let assignedEkskulId = null;

    const { data: roleData } = await db.from('user_roles')
      .select('role, extracurricular_id')
      .eq('email', email)
      .single();

    if (roleData) {
      userRole = roleData.role;
      assignedEkskulId = roleData.extracurricular_id;
    } else {
      // Jika email mengandung 'pengampu', atur role sebagai pengampu
      if (email.includes('pengampu')) userRole = 'pengampu';
    }

    // 3. Simpan Session Local Storage
    localStorage.setItem('user_session', JSON.stringify({
      email: email,
      role: userRole,
      ekskul_id: assignedEkskulId
    }));

    // 4. Redirect ke Dashboard
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
