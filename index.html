<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran Ekskul - SMPN 1 Tempuran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 20px; }
    .card { max-width: 500px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1e3a8a; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: #334155; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: 500; display: none; }
    .alert-danger { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

<div class="card">
  <h2>Form Pendaftaran Ekskul</h2>
  <p class="subtitle">SMPN 1 Tempuran</p>
  
  <div id="alert-box" class="alert"></div>

  <form id="ekskul-form">
    <div class="form-group">
      <label for="nisn">NISN</label>
      <input type="text" id="nisn" required placeholder="Masukkan NISN">
    </div>

    <div class="form-group">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
    </div>

    <div class="form-group">
      <label for="kelas">Kelas</label>
      <select id="kelas" required onchange="handleKelasChange()">
        <option value="">-- Pilih Kelas --</option>
        <option value="7">Kelas 7</option>
        <option value="8">Kelas 8</option>
        <option value="9">Kelas 9</option>
      </select>
    </div>

    <div id="group-ekskul-1" class="form-group" style="display: none;">
      <label for="ekskul1">Pilihan Ekskul 1</label>
      <select id="ekskul1" class="ekskul-select"><option value="">-- Pilih --</option></select>
    </div>

    <div id="group-ekskul-2" class="form-group" style="display: none;">
      <label for="ekskul2">Pilihan Ekskul 2</label>
      <select id="ekskul2" class="ekskul-select"><option value="">-- Pilih --</option></select>
    </div>

    <div id="group-ekskul-3" class="form-group" style="display: none;">
      <label for="ekskul3">Pilihan Ekskul 3 (Wajib untuk Kelas 7)</label>
      <select id="ekskul3" class="ekskul-select"><option value="">-- Pilih --</option></select>
    </div>

    <button type="submit">Kirim Pendaftaran</button>
  </form>
</div>

<script>
  // KREDENSIAL SUPABASE
  const SUPABASE_URL = 'https://ggpcizwstwiselfzsbbi.supabase.co';
  // PASTIKAN PASTE KUNCI DARI TAB "Legacy anon" SUPABASE YANG BERAWALAN eyJ...
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncGNpendzdHdpc2VsZnpzYmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjE5MDYsImV4cCI6MjEwNzQzNzkwNn0.IghtFISYdlY_mVkVGrz3bZvsOTq3NN6q2jYlKybU81E'; 

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let listEkskul = [];

  async function loadEkskulData() {
    const { data, error } = await db
      .from('extracurriculars')
      .select('*')
      .eq('aktif', true)
      .order('urutan', { ascending: true });

    if (!error && data) {
      listEkskul = data;
    } else if (error) {
      console.error('Gagal mengambil data ekskul:', error.message);
    }
  }

  function handleKelasChange() {
    const kelas = document.getElementById('kelas').value;
    const g1 = document.getElementById('group-ekskul-1');
    const g2 = document.getElementById('group-ekskul-2');
    const g3 = document.getElementById('group-ekskul-3');

    if (!kelas) {
      g1.style.display = g2.style.display = g3.style.display = 'none';
      return;
    }

    g1.style.display = g2.style.display = 'block';
    populateOptions();

    if (kelas === '7') {
      g3.style.display = 'block';
      document.getElementById('ekskul3').required = true;
    } else {
      g3.style.display = 'none';
      document.getElementById('ekskul3').required = false;
    }
  }

  function populateOptions() {
    const e1 = document.getElementById('ekskul1');
    const e2 = document.getElementById('ekskul2');
    const e3 = document.getElementById('ekskul3');

    e1.innerHTML = e2.innerHTML = e3.innerHTML = '<option value="">-- Pilih --</option>';

    listEkskul.forEach(item => {
      const opt = `<option value="${item.id}">${item.nama}</option>`;
      e1.innerHTML += opt;
      e2.innerHTML += opt;
      e3.innerHTML += opt;
    });
  }

  document.getElementById('ekskul-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    showAlert('', 'none');

    const nisn = document.getElementById('nisn').value;
    const nama = document.getElementById('nama').value;
    const kelas = document.getElementById('kelas').value;
    const p1 = document.getElementById('ekskul1').value;
    const p2 = document.getElementById('ekskul2').value;
    const p3 = kelas === '7' ? document.getElementById('ekskul3').value : null;

    if (!p1 || !p2 || (kelas === '7' && !p3)) {
      showAlert('Silakan lengkapi semua pilihan ekskul!', 'danger');
      return;
    }

    if (p1 === p2 || (kelas === '7' && (p1 === p3 || p2 === p3))) {
      showAlert('Ekskul yang dipilih tidak boleh sama!', 'danger');
      return;
    }

    const { data: student, error: errStudent } = await db
      .from('students')
      .insert([{ nisn, nama, kelas: parseInt(kelas) }])
      .select()
      .single();

    if (errStudent) {
      showAlert('Gagal menyimpan data siswa: ' + errStudent.message, 'danger');
      return;
    }

    const { error: errSelection } = await db
      .from('selections')
      .insert([{
        student_id: student.id,
        extracurricular_1_id: p1,
        extracurricular_2_id: p2,
        extracurricular_3_id: p3
      }]);

    if (errSelection) {
      showAlert('Gagal menyimpan pilihan ekskul: ' + errSelection.message, 'danger');
    } else {
      showAlert('Pendaftaran berhasil disimpan!', 'success');
      document.getElementById('ekskul-form').reset();
      handleKelasChange();
    }
  });

  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    if (type === 'none') {
      box.style.display = 'none';
      return;
    }
    box.className = 'alert alert-' + type;
    box.innerText = msg;
    box.style.display = 'block';
  }

  loadEkskulData();
</script>
</body>
</html>
