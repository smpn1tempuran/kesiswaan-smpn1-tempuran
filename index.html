<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ekskul - SMPN 1 Tempuran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: #fff; width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1e3a8a; margin-top: 0; }
    p.sub { text-align: center; color: #64748b; margin-top: -10px; margin-bottom: 25px; font-size: 14px; }
    .step-indicator { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .step-indicator span { font-size: 12px; font-weight: bold; color: #94a3b8; }
    .step-indicator span.active { color: #2563eb; }
    .step { display: none; }
    .step.active { display: block; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 14px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input:disabled, select:disabled { background: #f1f5f9; cursor: not-allowed; color: #64748b; }
    .btn-group { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
    button { padding: 11px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-next { background: #2563eb; color: white; flex: 1; }
    .btn-prev { background: #94a3b8; color: white; }
    .summary-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; }
    .info-badge { background: #eff6ff; border-left: 4px solid #2563eb; padding: 10px; font-size: 13px; color: #1e40af; margin-bottom: 15px; border-radius: 0 6px 6px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>SMPN 1 TEMPURAN</h2>
  <p class="sub">Formulir Pendaftaran Ekstrakurikuler</p>

  <div class="step-indicator">
    <span id="ind-1" class="active">1. Identitas</span>
    <span id="ind-2">2. Pilih Ekskul</span>
    <span id="ind-3">3. Konfirmasi</span>
  </div>

  <form id="form-pendaftaran">
    <!-- Langkah 1: Identitas -->
    <div class="step active" id="step-1">
      <div class="form-group">
        <label for="nisn">NISN</label>
        <input type="text" id="nisn" required placeholder="Masukkan NISN">
      </div>
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
      </div>
      <div class="form-group">
  <label for="kelas">Kelas</label>
  <select id="kelas" required onchange="handleKelasChange()">
    <option value="">-- Pilih Kelas --</option>
    <optgroup label="Kelas 7">
      <option value="7A">Kelas 7A</option>
      <option value="7B">Kelas 7B</option>
      <option value="7C">Kelas 7C</option>
      <option value="7D">Kelas 7D</option>
      <option value="7E">Kelas 7E</option>
      <option value="7F">Kelas 7F</option>
      <option value="7G">Kelas 7G</option>
    </optgroup>
    <optgroup label="Kelas 8">
      <option value="8A">Kelas 8A</option>
      <option value="8B">Kelas 8B</option>
      <option value="8C">Kelas 8C</option>
      <option value="8D">Kelas 8D</option>
      <option value="8E">Kelas 8E</option>
      <option value="8F">Kelas 8F</option>
      <option value="8G">Kelas 8G</option>
    </optgroup>
  </select>
</div>

      <!-- Opsi Dewan Penggalang untuk Kelas 8 -->
      <div class="form-group" id="group-dp" style="display: none;">
        <label for="is_dp">Status Anggota Dewan Penggalang (DP)?</label>
        <select id="is_dp" onchange="handleKelasChange()">
          <option value="tidak">Bukan Dewan Penggalang</option>
          <option value="ya">Ya, Anggota Dewan Penggalang</option>
        </select>
      </div>

      <div class="btn-group">
        <div></div>
        <button type="button" class="btn-next" onclick="validateStep1()">Lanjut Pilih Ekskul &rarr;</button>
      </div>
    </div>

    <!-- Langkah 2: Pemilihan Ekstrakurikuler -->
    <div class="step" id="step-2">
      <div id="info-rules" class="info-badge"></div>

      <div class="form-group" id="group-ekskul1">
        <label for="ekskul1" id="lbl-ekskul1">Pilihan Utama (Wajib)</label>
        <select id="ekskul1">
          <option value="">-- Pilih Ekskul 1 --</option>
        </select>
      </div>
      <div class="form-group" id="group-ekskul2">
        <label for="ekskul2" id="lbl-ekskul2">Pilihan Ekskul 2</label>
        <select id="ekskul2">
          <option value="">-- Pilih Ekskul 2 --</option>
        </select>
      </div>
      <div class="form-group" id="group-ekskul3">
        <label for="ekskul3" id="lbl-ekskul3">Pilihan Ekskul 3</label>
        <select id="ekskul3">
          <option value="">-- Tidak Memilih --</option>
        </select>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="nextStep(1)">&larr; Kembali</button>
        <button type="button" class="btn-next" onclick="prepareSummary()">Cek Konfirmasi &rarr;</button>
      </div>
    </div>

    <!-- Langkah 3: Konfirmasi Final -->
    <div class="step" id="step-3">
      <div class="summary-box" id="summary-content"></div>
      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="nextStep(2)">&larr; Ubah Pilihan</button>
        <button type="submit" class="btn-next" id="btn-submit">Konfirmasi & Simpan</button>
      </div>
    </div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ggpcizwstwiselfzsbbi.supabase.co';
  // PASTIKAN PASTE ANON KEY SUPABASE KAMU DI SINI:
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncGNpendzdHdpc2VsZnpzYmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjE5MDYsImV4cCI6MjEwNzQzNzkwNn0.IghtFISYdlY_mVkVGrz3bZvsOTq3NN6q2jYlKybU81E';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let ekskulList = [];
  let pramukaId = null;

  async function loadEkskul() {
    const { data } = await db.from('extracurriculars').select('*').order('nama');
    if (data) {
      ekskulList = data;
      const pramuka = data.find(e => e.nama.toLowerCase().includes('pramuka'));
      if (pramuka) pramukaId = pramuka.id;

      populateDropdowns();
    }
  }

  function populateDropdowns() {
    const opts = ekskulList.map(e => `<option value="${e.id}">${e.nama}</option>`).join('');
    document.getElementById('ekskul1').innerHTML = '<option value="">-- Pilih Ekskul 1 --</option>' + opts;
    document.getElementById('ekskul2').innerHTML = '<option value="">-- Pilih Ekskul 2 --</option>' + opts;
    document.getElementById('ekskul3').innerHTML = '<option value="">-- Tidak Memilih --</option>' + opts;
  }

  function handleKelasChange() {
  const kelas = document.getElementById('kelas').value;
  const groupDp = document.getElementById('group-dp');
  const isDp = document.getElementById('is_dp').value;

  // Cek apakah siswa Kelas 8 (misal: 8, 8A, 8B, dst)
  if (kelas.startsWith('8')) {
    groupDp.style.display = 'block';
  } else {
    groupDp.style.display = 'none';
    document.getElementById('is_dp').value = 'tidak';
  }

  const ekskul1Select = document.getElementById('ekskul1');
  const groupEkskul3 = document.getElementById('group-ekskul3');
  const infoRules = document.getElementById('info-rules');

  // Cek jika Kelas 7 (7A-7G) ATAU Kelas 8 Dewan Penggalang (DP)
  if (kelas.startsWith('7') || (kelas.startsWith('8') && isDp === 'ya')) {
    // Wajib Pramuka + 2 Ekskul Pilihan (Total 3)
    if (pramukaId) {
      ekskul1Select.value = pramukaId;
      ekskul1Select.disabled = true;
    }
    if (groupEkskul3) groupEkskul3.style.display = 'block';
    if (infoRules) {
      infoRules.innerText = 'Kelas 7 & Anggota Dewan Penggalang (DP) Wajib Pramuka + memilih 2 Ekskul Pilihan tambahan.';
    }
  } else {
    // Kelas 8 Non-DP (Bebas memilih 2 ekskul)
    ekskul1Select.disabled = false;
    if (groupEkskul3) groupEkskul3.style.display = 'none';
    if (infoRules) {
      infoRules.innerText = 'Kelas 8 dapat memilih maksimal 2 Ekskul Pilihan.';
    }
  }
}

  function validateStep1() {
    const nisn = document.getElementById('nisn').value.trim();
    const nama = document.getElementById('nama').value.trim();
    const kelas = document.getElementById('kelas').value;

    if (!nisn || !nama || !kelas) {
      alert('Mohon lengkapi NISN, Nama Lengkap, dan Kelas terlebih dahulu.');
      return;
    }
    handleKelasChange();
    nextStep(2);
  }

  function nextStep(stepNum) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step-' + stepNum).classList.add('active');

    for (let i = 1; i <= 3; i++) {
      const ind = document.getElementById('ind-' + i);
      if (i === stepNum) ind.classList.add('active');
      else ind.classList.remove('active');
    }
  }

  function prepareSummary() {
    const e1 = ekskulList.find(e => e.id == document.getElementById('ekskul1').value);
    const e2 = ekskulList.find(e => e.id == document.getElementById('ekskul2').value);
    const e3 = ekskulList.find(e => e.id == document.getElementById('ekskul3').value);

    if (!document.getElementById('ekskul1').value || !document.getElementById('ekskul2').value) {
      alert('Mohon isi minimal 2 pilihan ekstrakurikuler!');
      return;
    }

    const kelas = document.getElementById('kelas').value;
    const isDp = document.getElementById('is_dp').value;
    const showE3 = (kelas === '7' || (kelas === '8' && isDp === 'ya'));

    let summaryHtml = `
      <strong>Konfirmasi Data Pendaftaran:</strong><br><br>
      • NISN: <strong>${document.getElementById('nisn').value}</strong><br>
      • Nama: <strong>${document.getElementById('nama').value}</strong><br>
      • Kelas: <strong>Kelas ${kelas}</strong><br>
      • Pilihan 1: <strong>${e1 ? e1.nama : '-'}</strong><br>
      • Pilihan 2: <strong>${e2 ? e2.nama : '-'}</strong>
    `;

    if (showE3 && e3) {
      summaryHtml += `<br>• Pilihan 3: <strong>${e3.nama}</strong>`;
    }

    document.getElementById('summary-content').innerHTML = summaryHtml;
    nextStep(3);
  }

  document.getElementById('form-pendaftaran').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerText = 'Menyimpan...';

    const nisn = document.getElementById('nisn').value.trim();
    const nama = document.getElementById('nama').value.trim();
    const kelas = parseInt(document.getElementById('kelas').value);
    const isDp = document.getElementById('is_dp').value;

    // 1. Simpan/Update Siswa
    const { data: student, error: errStudent } = await db.from('students').insert([{ nisn, nama_lengkap: nama, kelas }]).select().single();

    if (errStudent) {
      alert('Gagal simpan data siswa: ' + errStudent.message);
      btn.disabled = false; return;
    }

    const e1 = document.getElementById('ekskul1').value || null;
    const e2 = document.getElementById('ekskul2').value || null;
    let e3 = document.getElementById('ekskul3').value || null;

    // Jika Kelas 8 Bukan Dewan Penggalang, paksa e3 menjadi null
    if (kelas === 8 && isDp === 'tidak') {
      e3 = null;
    }

    // 2. Simpan Pilihan ke Database Supabase
    const { data: selection, error: errSel } = await db.from('selections').insert([{
      student_id: student.id,
      extracurricular_1_id: e1,
      extracurricular_2_id: e2,
      extracurricular_3_id: e3
    }]).select().single();

    if (errSel) {
      alert('Gagal simpan pilihan ekskul: ' + errSel.message);
      btn.disabled = false; return;
    }

    window.location.href = `bukti.html?id=${selection.id}`;
  });

  document.addEventListener('DOMContentLoaded', loadEkskul);
</script>
</body>
</html>
