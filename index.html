<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ekskul - SMPN 1 Tempuran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: #fff; width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1e3a8a; margin-top: 0; }
    p.sub { text-align: center; color: #64748b; margin-top: -10px; margin-bottom: 25px; font-size: 14px; }
    .step-indicator { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .step-indicator span { font-size: 12px; font-weight: bold; color: #94a3b8; }
    .step-indicator span.active { color: #2563eb; }
    .step { display: none; }
    .step.active { display: block; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 14px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .btn-group { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
    button { padding: 11px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-next { background: #2563eb; color: white; flex: 1; }
    .btn-prev { background: #94a3b8; color: white; }
    .summary-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="container">
  <h2>SMPN 1 TEMPURAN</h2>
  <p class="sub">Formulir Pendaftaran Ekstrakurikuler</p>

  <div class="step-indicator">
    <span id="ind-1" class="active">1. Identitas</span>
    <span id="ind-2">2. Ekskul</span>
    <span id="ind-3">3. Konfirmasi</span>
  </div>

  <form id="form-pendaftaran">
    <!-- Langkah 1 & 2 Alur Siswa: Identitas & Kelas -->
    <div class="step active" id="step-1">
      <div class="form-group">
        <label for="nisn">NISN</label>
        <input type="text" id="nisn" required placeholder="Masukkan NISN">
      </div>
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
      </div>
      <div class="form-group">
        <label for="kelas">Kelas</label>
        <select id="kelas" required>
          <option value="">-- Pilih Kelas --</option>
          <option value="7">Kelas 7</option>
          <option value="8">Kelas 8</option>
        </select>
      </div>
      <div class="btn-group">
        <div></div>
        <button type="button" class="btn-next" onclick="nextStep(2)">Lanjut Pilihan Ekskul &rarr;</button>
      </div>
    </div>

    <!-- Langkah 3 Alur Siswa: Memilih Ekstrakurikuler -->
    <div class="step" id="step-2">
      <div class="form-group">
        <label for="ekskul1">Pilihan Utama (Wajib)</label>
        <select id="ekskul1" required>
          <option value="">-- Pilih Ekskul Utama --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="ekskul2">Pilihan 2 (Opsional)</label>
        <select id="ekskul2">
          <option value="">-- Tidak Memilih --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="ekskul3">Pilihan 3 (Opsional)</label>
        <select id="ekskul3">
          <option value="">-- Tidak Memilih --</option>
        </select>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="nextStep(1)">&larr; Kembali</button>
        <button type="button" class="btn-next" onclick="prepareSummary()">Cek Konfirmasi &rarr;</button>
      </div>
    </div>

    <!-- Langkah 4 Alur Siswa: Memeriksa Pilihan & Konfirmasi Final -->
    <div class="step" id="step-3">
      <div class="summary-box" id="summary-content">
        <!-- Rincian akan diisi otomatis -->
      </div>
      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="nextStep(2)">&larr; Ubah Pilihan</button>
        <button type="submit" class="btn-next" id="btn-submit">Konfirmasi & Simpan</button>
      </div>
    </div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ggpcizwstwiselfzsbbi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncGNpendzdHdpc2VsZnpzYmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjE5MDYsImV4cCI6MjEwNzQzNzkwNn0.IghtFISYdlY_mVkVGrz3bZvsOTq3NN6q2jYlKybU81E';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let ekskulList = [];

  async function loadEkskul() {
    const { data } = await db.from('extracurriculars').select('*').order('nama');
    if (data) {
      ekskulList = data;
      const opts = data.map(e => `<option value="${e.id}">${e.nama}</option>`).join('');
      document.getElementById('ekskul1').innerHTML += opts;
      document.getElementById('ekskul2').innerHTML += opts;
      document.getElementById('ekskul3').innerHTML += opts;
    }
  }

  function nextStep(stepNum) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step-' + stepNum).classList.add('active');

    for (let i = 1; i <= 3; i++) {
      const ind = document.getElementById('ind-' + i);
      if (i === stepNum) ind.classList.add('active');
      else ind.classList.remove('active');
    }
  }

  function prepareSummary() {
    const e1 = ekskulList.find(e => e.id == document.getElementById('ekskul1').value);
    const e2 = ekskulList.find(e => e.id == document.getElementById('ekskul2').value);
    const e3 = ekskulList.find(e => e.id == document.getElementById('ekskul3').value);

    document.getElementById('summary-content').innerHTML = `
      <strong>Konfirmasi Data Pendaftaran:</strong><br><br>
      • NISN: <strong>${document.getElementById('nisn').value}</strong><br>
      • Nama: <strong>${document.getElementById('nama').value}</strong><br>
      • Kelas: <strong>Kelas ${document.getElementById('kelas').value}</strong><br>
      • Pilihan 1: <strong>${e1 ? e1.nama : '-'}</strong><br>
      • Pilihan 2: <strong>${e2 ? e2.nama : '-'}</strong><br>
      • Pilihan 3: <strong>${e3 ? e3.nama : '-'}</strong>
    `;
    nextStep(3);
  }

  document.getElementById('form-pendaftaran').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerText = 'Menyimpan...';

    const nisn = document.getElementById('nisn').value.trim();
    const nama = document.getElementById('nama').value.trim();
    const kelas = document.getElementById('kelas').value;

    // Simpan data student
    const { data: student, error: errStudent } = await db.from('students').insert([{ nisn, nama_lengkap: nama, kelas }]).select().single();

    if (errStudent) {
      alert('Gagal simpan data siswa: ' + errStudent.message);
      btn.disabled = false; return;
    }

    // Simpan pilihan ekskul
    const { data: selection, error: errSel } = await db.from('selections').insert([{
      student_id: student.id,
      extracurricular_1_id: document.getElementById('ekskul1').value || null,
      extracurricular_2_id: document.getElementById('ekskul2').value || null,
      extracurricular_3_id: document.getElementById('ekskul3').value || null
    }]).select().single();

    if (errSel) {
      alert('Gagal simpan pilihan ekskul: ' + errSel.message);
      btn.disabled = false; return;
    }

    // Alur 5: Langsung buka Surat Pernyataan Kesanggupan
    window.location.href = `bukti.html?id=${selection.id}`;
  });

  document.addEventListener('DOMContentLoaded', loadLoad = loadEkskul);
</script>
</body>
</html>
